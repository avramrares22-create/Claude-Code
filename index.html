<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Natura</title>
    <meta name="description" content="Off-road and nature map of Romania: hidden trails, satellite imagery, hike / bike / moto routing." />
    <meta name="theme-color" content="#0a0f0d" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS: launch as a standalone full-screen app from the home screen, not a Safari shortcut -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Natura" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  </head>
  <body>
    <div id="map" aria-label="Map"></div>

    <!-- Top: search + loading bar -->
    <header class="topbar">
      <div class="search glass" role="search">
        <span class="search-icon"></span>
        <input id="search" type="search" placeholder="Search peaks, huts, villages…" autocomplete="off" enterkeyhint="search" aria-label="Search places" />
        <button id="search-clear" class="icon-btn" hidden aria-label="Clear search"></button>
      </div>
      <ul id="search-results" class="results glass" hidden></ul>
      <div id="progress" class="progress" aria-hidden="true"><span></span></div>
      <div id="badges"></div>
    </header>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- Right-side floating controls -->
    <div class="fabs">
      <button id="fab-locate" class="fab glass" aria-label="My location"></button>
      <button id="fab-3d" class="fab glass" aria-label="3D terrain"></button>
    </div>

    <!-- Navigation HUD (shown while following a route) -->
    <div id="nav-hud" class="nav-hud glass" hidden></div>

    <section id="sheet" class="sheet glass" data-state="hidden" aria-live="polite"></section>

    <nav class="tabbar glass" aria-label="Main">
      <button id="tab-layers" class="tab"><i></i><span>Layers</span></button>
      <button id="tab-hidden" class="tab"><i></i><span>Hidden</span></button>
      <button id="tab-scan" class="tab tab-primary"><i></i><span>Scan</span></button>
      <button id="tab-route" class="tab"><i></i><span>Route</span></button>
      <button id="tab-more" class="tab"><i></i><span>More</span></button>
    </nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
